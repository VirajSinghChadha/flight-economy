<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Economy Simulator</title>
<style>
:root{--bg:#0b1622;--panel:#122233;--panel2:#18304a;--line:#25415f;--txt:#e6f0fa;--mut:#8aa4bf;--acc:#2fd0b5;--warn:#ffc548;--bad:#ff5d5d;--good:#5de08a;--blue:#4aa3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#top{position:fixed;left:0;right:0;top:0;height:36px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;z-index:5;overflow-x:auto;white-space:nowrap}
#top b.logo{font-size:15px;color:var(--acc)}
.stat small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.stat span{font-weight:700;font-size:14px}
.sp{margin-left:auto;display:flex;gap:4px}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#04201a;border-color:var(--acc);font-weight:700}
button.pri{background:var(--acc);color:#04201a;border-color:var(--acc);font-weight:700}
button.dan{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
#map{position:fixed;left:0;top:36px;width:100vw;height:calc(100vh - 66px);display:block;cursor:grab}
#map.drag{cursor:grabbing}
#side{position:fixed;right:10px;bottom:38px;width:320px;max-height:48vh;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none;flex-direction:column;z-index:4;box-shadow:0 6px 24px #000a}
#side.open{display:flex}
.stat.x{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:30px;background:#08111b;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 8px;z-index:5}
#bar button{padding:2px 10px}
#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
#tabs button{flex:none;border:0;border-radius:0;background:none;padding:6px 9px;font-size:12px;color:var(--mut);position:relative}
#tabs button.on{color:var(--acc);background:var(--panel2);box-shadow:inset 0 -2px var(--acc)}
#tabs .bd{position:absolute;top:3px;right:4px;background:var(--bad);color:#fff;border-radius:8px;font-size:10px;padding:0 5px}
#body{flex:1;overflow-y:auto;padding:8px;font-size:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.card h4{margin:0 0 4px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:10px;background:#0b1622;border:1px solid var(--line);margin-left:4px}
.tag.red{background:#4a1515;border-color:var(--bad);color:#ffb0b0}.tag.yel{background:#4a3a10;border-color:var(--warn);color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--acc)}
select,input[type=text]{font:inherit;background:#0b1622;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.bar{height:6px;border-radius:3px;background:#0b1622;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#ticker{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker b{color:var(--warn)}
#search{position:fixed;left:10px;top:44px;z-index:3;width:230px}
#search input{width:100%;padding:7px 9px}
#sres{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:2px;display:none;max-height:260px;overflow:auto}
#sres div{padding:5px 9px;cursor:pointer}#sres div:hover{background:var(--panel2)}
#zoom{position:fixed;left:10px;top:88px;z-index:3;display:flex;flex-direction:column;gap:4px}
#city{position:fixed;left:10px;bottom:40px;width:290px;z-index:3;display:none;box-shadow:0 4px 16px #0008}
#tip{position:fixed;pointer-events:none;background:#000c;padding:3px 7px;border-radius:5px;z-index:6;display:none}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:44px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,60vw)}
.toast{background:#0b1622ee;border:1px solid var(--line);border-left:4px solid var(--blue);padding:7px 11px;border-radius:7px;box-shadow:0 4px 14px #0008;animation:fade 7s forwards}
.toast.war{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}.toast.good{border-left-color:var(--good)}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:center;justify-content:center}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(560px,94vw);max-height:88vh;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:3px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:11px}
@media(max-width:600px){#side{width:calc(100% - 20px)}}

/* ---- Fly Corp style layout ---- */
#map{height:calc(100vh - 36px)}
#side{left:50%;right:auto;transform:translateX(-50%);bottom:86px;width:min(390px,94vw);max-height:52vh;border-radius:14px}
#ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:linear-gradient(#1c3b5c,#18304a);border-radius:14px 14px 0 0;border-bottom:1px solid var(--line);font-size:14px}
#ph button{padding:1px 8px;border-radius:50%}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:6;display:flex;gap:8px;padding:6px 10px;background:#0b1622d9;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #000a;border-bottom:1px solid var(--line);overflow:visible}
#tabs button{flex:none;width:58px;padding:5px 0 3px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:none}
#tabs button .ic{font-size:21px;line-height:1.2}
#tabs button small{font-size:10px;color:var(--mut)}
#tabs button.on{background:var(--acc);box-shadow:none}
#tabs button.on small{color:#04201a;font-weight:700}
#tabs .bd{top:-4px;right:-3px}
#ticker{position:fixed;top:42px;left:50%;transform:translateX(-50%);z-index:4;background:#4a1515ee;border:1px solid var(--bad);border-radius:14px;padding:3px 12px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffd0d0}
#ticker:empty{display:none}
#city{bottom:90px}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
@media(max-width:600px){#tabs{gap:3px;padding:5px}#tabs button{width:40px}#tabs button small{display:none}#side{bottom:66px}#city{bottom:70px}}

#tut{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center}
#tut .box{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:20px;width:min(480px,92vw);box-shadow:0 10px 40px #000}
#tut h2{margin:0 0 8px;color:var(--acc)} #tut p{line-height:1.5;font-size:14px}
#tut .dots{display:flex;gap:5px;margin:10px 0}#tut .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}#tut .dots i.on{background:var(--acc)}
#upd{position:fixed;top:40px;right:10px;z-index:15;background:#12384a;border:1px solid var(--acc);border-radius:12px;padding:8px 12px;max-width:340px;display:none;box-shadow:0 6px 20px #000a}
#tabs{max-width:98vw;overflow-x:auto;gap:6px}#tabs button{width:52px}
</style>
</head>
<body>
<div id="top">
 <b class="logo">✈ Flight Economy Simulator</b>
 <div class="stat"><small>Cash</small><span id="sCash"></span></div>
 <div class="stat x"><small>Net worth</small><span id="sNW"></span></div>
 <div class="stat"><small>Date</small><span id="sDate"></span></div>

<canvas id="map"></canvas>

<div id="toasts"></div>

<span id="ticker"></span>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="tut"><div class="box" id="tbox"></div></div>

<script>
const D=/*DATA*/null;
/* ===================== data ===================== */
const C=D.cities.map((c,i)=>({id:i,name:c[0],cc:c[1],lat:c[2],lon:c[3],pop:c[4]*1000,iata:c[5],port:!!c[6],country:D.countries[c[1]]||c[1]}));
/* ---- destination appeal: people love Paris, Dubai, Europe, beaches... not just big populations ---- */
const APP_C={FR:1.6,ES:1.5,IT:1.5,TR:1.4,TH:1.5,AE:1.6,GB:1.3,DE:1.15,US:1.25,MX:1.2,JP:1.35,GR:1.4,PT:1.3,NL:1.2,AT:1.15,CH:1.2,SG:1.5,MY:1.15,ID:1.1,VN:1.1,
 EG:1.2,MA:1.2,HR:1.3,CZ:1.2,HU:1.1,IE:1.15,AU:1.2,NZ:1.2,CA:1.1,ZA:1.1,KR:1.2,QA:1.3,CU:1.1,DO:1.2,MV:1.8,IS:1.3,IN:.9,NG:.8,PK:.8,BD:.8,CD:.75,IQ:.8,AF:.7,YE:.7,SY:.7};
const APP_CITY={Paris:1.8,Dubai:1.7,London:1.5,Rome:1.6,Barcelona:1.5,Istanbul:1.4,Bangkok:1.5,Singapore:1.4,'New York City':1.5,Tokyo:1.3,'Las Vegas':1.7,Orlando:1.7,Miami:1.4,
 Honolulu:1.7,Cancun:1.7,Venice:1.7,Amsterdam:1.4,Prague:1.3,Vienna:1.2,Lisbon:1.3,Athens:1.2,Denpasar:1.7,'Hong Kong':1.3,Sydney:1.3,'Los Angeles':1.2,'San Francisco':1.2,
 Marrakesh:1.4,Nice:1.5,Florence:1.4,Seoul:1.2,Osaka:1.2,Kyoto:1.3,Doha:1.2,'Abu Dhabi':1.2,Antalya:1.6,Madrid:1.2,Milan:1.2,Berlin:1.2,Munich:1.1,Zurich:1.1,Geneva:1.2,Dublin:1.15,
 Edinburgh:1.3,'Cape Town':1.5,'Rio de Janeiro':1.4,'Mexico City':1.1,'Buenos Aires':1.1,Havana:1.2,Budapest:1.2,Palma:1.4,Malaga:1.3,Naples:1.2,Cairo:1.1,Phuket:1.8,Krakow:1.2,Seville:1.2,Valencia:1.2};
C.forEach(c=>{c.app=Math.max(.7,Math.min(3,(APP_C[c.cc]||1)*(APP_CITY[c.name]||1)))});
const REG={EU:'FR ES IT DE GB NL BE AT CH PT GR IE PL CZ HU SE NO DK FI HR RO BG RS SK SI LT LV EE LU MT CY IS UA',NA:'US CA MX',AS:'CN JP KR TH SG MY ID VN PH IN HK TW KH LA MM',GULF:'AE QA SA KW BH OM'};
const REGOF={};for(const k in REG)REG[k].split(' ').forEach(cc=>REGOF[cc]=k);
function regionBonus(a,b){const x=REGOF[C[a].cc],y=REGOF[C[b].cc];
  if(!x||!y)return 1;if(x==y)return x=='EU'?1.3:x=='AS'?1.15:1.1;
  return (x=='EU'&&(y=='NA'||y=='GULF'))||(y=='EU'&&(x=='NA'||x=='GULF'))?1.2:1}
function pairDemand(a,b,d,floor){return Math.max(floor||12,.0006*Math.sqrt(C[a].pop*C[b].pop)*Math.sqrt(C[a].app*C[b].app)*regionBonus(a,b)/(1+d/6000))}
const appealText=c=>c.app>=1.8?'⭐⭐⭐ Iconic destination':c.app>=1.4?'⭐⭐ Very popular destination':c.app>=1.15?'⭐ Popular destination':c.app<.9?'Low tourism demand':'Standard demand';
const SEARCH=C.map(c=>(c.name+' '+c.country+' '+c.iata).toLowerCase());
const TYPES=[
 // id,name,kind,cap,speed,range,price,burn kg/km,unlock lifetime revenue
 ['c208','Cessna 208 Caravan','pax',9,340,1700,3e5,.5,0],
 ['b1900','Beechcraft 1900D','pax',19,440,1500,7e5,.9,0],
 ['atr72','ATR 72-600','pax',70,510,1500,3.2e6,1.3,1e6],
 ['q400','Dash 8 Q400','pax',78,667,2000,4e6,1.6,2e6],
 ['crj9','Bombardier CRJ900','pax',90,830,2900,5.8e6,3.2,4e6],
 ['e175','Embraer E175','pax',88,830,3700,6e6,3.0,6e6],
 ['a220','Airbus A220-300','pax',145,830,6200,9.5e6,3.0,15e6],
 ['b738','Boeing 737-800','pax',189,840,5400,12e6,2.9,30e6],
 ['a20n','Airbus A320neo','pax',180,830,6500,13e6,2.5,45e6],
 ['a21n','Airbus A321neo','pax',220,830,7400,15.5e6,2.9,70e6],
 ['b789','Boeing 787-9','pax',290,903,14100,32e6,5.4,150e6],
 ['a359','Airbus A350-900','pax',325,910,15000,35e6,5.6,250e6],
 ['b77w','Boeing 777-300ER','pax',396,905,13600,40e6,7.5,400e6],
 ['b748','Boeing 747-8','pax',467,913,14300,46e6,10,800e6],
 ['a388','Airbus A380-800','pax',555,903,15200,50e6,12.5,1.5e9],
 ['atrf','ATR 72-600F','cargo',8,500,1500,3.4e6,1.3,1e6],
 ['b738f','Boeing 737-800BCF','cargo',23,840,3700,9e6,3.0,20e6],
 ['b763f','Boeing 767-300F','cargo',52,850,6000,18e6,5.5,100e6],
 ['b77f','Boeing 777F','cargo',102,905,9100,42e6,7.4,600e6],
 ['b748f','Boeing 747-8F','cargo',134,910,8100,48e6,10,1e9],
].map(t=>({id:t[0],name:t[1],kind:t[2],cap:t[3],speed:t[4],range:t[5],price:t[6],burn:t[7],unlock:t[8],
  hr:t[2]=='pax'?60+t[3]*3.5:200+t[3]*8, turn:t[2]=='pax'?.5+t[3]/250:.7+t[3]/150}));
const SHAPE={ // length, wingspan, sweep, engines, prop  (px on the map)
 c208:[8,10,0,1,1],b1900:[9,11,0,2,1],atr72:[10,13,0,2,1],q400:[11,14,0,2,1],atrf:[10,13,0,2,1],
 crj9:[11,10,3,0,0],e175:[11,11,3,0,0],a220:[12,12,4,2,0],
 b738:[13,12,4,2,0],a20n:[13,12,4,2,0],a21n:[14,12,4,2,0],b738f:[13,12,4,2,0],
 b789:[16,16,5,2,0],a359:[16,16,5,2,0],b77w:[18,18,5,2,0],b763f:[16,16,5,2,0],b77f:[18,18,5,2,0],
 b748:[20,20,6,4,0],b748f:[20,20,6,4,0],a388:[22,22,6,4,0]};
const PCOL={ferry:['#6ee7ff','Ferry'],cruise:['#ffd166','Cruise ship'],prop:['#5de08a','Prop'],reg:['#2fd0d0','Regional jet'],narrow:['#4aa3ff','Narrowbody'],wide:['#b48cff','Widebody'],jumbo:['#ff7ab6','Jumbo'],cargo:['#ffa84a','Freighter']};
const pclass=t=>t.kind=='ship'?t.sub:t.kind=='cargo'?'cargo':SHAPE[t.id][4]?'prop':SHAPE[t.id][3]==4?'jumbo':t.cap>=250?'wide':t.cap>=170?'narrow':'reg';
const planeColor=t=>PCOL[pclass(t)][0];
const icon=t=>`<span style="color:${planeColor(t)}">✈</span>`;
function drawShip(g,T,fill,k){
  const L=10+Math.sqrt(T.cap)*.28,w=L*.2;g.save();g.scale(k,k);g.strokeStyle='#04121c';g.lineWidth=.8;
  g.fillStyle=fill;g.beginPath();g.moveTo(L/2,0);g.lineTo(L*.28,-w);g.lineTo(-L/2,-w);g.lineTo(-L/2,w);g.lineTo(L*.28,w);g.closePath();g.fill();g.stroke();
  g.fillStyle='rgba(255,255,255,.75)';g.fillRect(-L*.28,-w*.6,L*.4,w*1.2);
  if(T.sub=='cruise'){g.fillStyle='#e0554f';g.fillRect(-L*.08,-w*.3,L*.1,w*.6)}
  g.restore()}
function drawPlane(g,id,fill,k){
  const [L,Wg,sw,en,prop]=SHAPE[id],w=L*.09;g.save();g.scale(k,k);
  g.fillStyle=fill;g.strokeStyle='#04121c';g.lineWidth=.8;
  g.beginPath();g.ellipse(0,0,L/2,w,0,0,7);g.fill();g.stroke();
  if(id=='b748'||id=='b748f'||id=='a388'){g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(L*.2,0,L*.15,w*.7,0,0,7);g.fill()}
  if(TY[id].kind=='cargo'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-L*.25,-w*.4,L*.5,w*.8)}
  g.fillStyle=fill;
  for(const m of[1,-1]){
    g.beginPath();g.moveTo(L*.14,m*w);g.lineTo(L*.14-sw,m*Wg/2);g.lineTo(L*.14-sw-L*.2,m*Wg/2);g.lineTo(-L*.08,m*w);g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(-L*.3,m*w);g.lineTo(-L*.46,m*Wg*.22);g.lineTo(-L*.5,m*Wg*.22);g.lineTo(-L*.46,m*w);g.closePath();g.fill();g.stroke()}
  g.fillStyle='#04121c';
  if(en==1&&prop){g.fillRect(L*.5-1,-w*1.6,1.4,w*3.2)}
  else if(en==2){for(const m of[1,-1]){g.beginPath();g.arc(L*.14-sw-L*.05,m*Wg*.27,1.5,0,7);g.fill();if(prop)g.fillRect(L*.14-sw+L*.02,m*Wg*.27-1.5,1.2,3)}}
  else if(en==4){for(const m of[1,-1])for(const q of[.22,.4]){g.beginPath();g.arc(L*.14-sw-L*.05-(q>.3?0:-1),m*Wg*q,1.5,0,7);g.fill()}}
  else{for(const m of[1,-1]){g.beginPath();g.arc(-L*.36,m*(w+1.2),1.5,0,7);g.fill()}}  // rear-mounted jet engines
  g.restore()}
[ // id,name,sub,cap,speed,range,price,burn,unlock,fare0,fare/km,turn hrs
 ['ferry1','Coastal Ferry','ferry',200,35,1200,2.5e6,12,0,40,.35,2],
 ['ferry2','Fast Ferry (catamaran)','ferry',450,65,2000,8e6,40,3e6,45,.30,2.5],
 ['ferry3','RoPax Ferry','ferry',1200,40,3500,30e6,110,20e6,50,.28,4],
 ['cru1','Boutique Cruise Ship','cruise',600,34,20000,60e6,100,50e6,400,.45,10],
 ['cru2','Cruise Ship','cruise',2400,38,20000,220e6,300,250e6,450,.50,12],
 ['cru3','Mega Cruise Ship','cruise',5400,40,20000,520e6,520,1e9,500,.55,14]
].forEach(t=>TYPES.push({id:t[0],name:t[1],kind:'ship',sub:t[2],cap:t[3],speed:t[4],range:t[5],price:t[6],burn:t[7],unlock:t[8],fare0:t[9],fkm:t[10],turn:t[11],hr:t[2]=='ferry'?60+t[3]*.5:300+t[3]*.35}));
const TY={};TYPES.forEach(t=>TY[t.id]=t);
const maxShip=c=>c.pop<250e3?800:c.pop<1e6?2500:99999;
const RIVALS=['Skyline Air','Pacifica Wings','EuroJet','Gulf Crown','Andes Air','Nordic Star'];

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const R2D=180/Math.PI,D2R=Math.PI/180;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fmt(n){const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+'$'+(a/1e6).toFixed(2)+'M';if(a>=1e3)return s+'$'+(a/1e3).toFixed(1)+'k';return s+'$'+Math.round(a)}
function fpop(p){return p>=1e6?(p/1e6).toFixed(1)+'M':Math.round(p/1e3)+'k'}
function hav(lat1,lon1,lat2,lon2){const a=Math.sin((lat2-lat1)*D2R/2)**2+Math.cos(lat1*D2R)*Math.cos(lat2*D2R)*Math.sin((lon2-lon1)*D2R/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(a)))}
function gc(a,b,n){
  const v=c=>[Math.cos(c.lat*D2R)*Math.cos(c.lon*D2R),Math.cos(c.lat*D2R)*Math.sin(c.lon*D2R),Math.sin(c.lat*D2R)];
  const p=v(a),q=v(b),om=Math.acos(Math.max(-1,Math.min(1,p[0]*q[0]+p[1]*q[1]+p[2]*q[2]))),pts=[];let prev=a.lon;
  for(let i=0;i<=n;i++){const t=i/n,s=Math.sin(om)||1e-9,k1=Math.sin((1-t)*om)/s,k2=Math.sin(t*om)/s;
    const x=k1*p[0]+k2*q[0],y=k1*p[1]+k2*q[1],z=k1*p[2]+k2*q[2];
    let lon=Math.atan2(y,x)*R2D;while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;prev=lon;
    pts.push([lon,Math.atan2(z,Math.hypot(x,y))*R2D])}
  return pts}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function maxCap(c,kind){return kind=='pax'?(c.pop<250e3?110:c.pop<600e3?240:c.pop<1.5e6?340:9999):(c.pop<250e3?10:c.pop<600e3?30:c.pop<1.5e6?60:9999)}
function landingFee(c,t){return (60+160*Math.sqrt(c.pop/1e6))*(.5+t.cap/(t.kind=='cargo'?60:t.kind=='ship'?1500:200))}

   st:{pax:0,tons:0,flights:0,cancels:0,refunds:0,fees:0},yearPax:0,yearProfit:0,dayProfit:0,est:0,
   up:{ins:0,lounge:0,hedge:0},loans:[],ap:{},autoSvc:false,autoThr:40,scn:null,scnDone:[],camp:{},goodwill:0,dc:null,saleCount:0,paxMark:0,paxPrev:30,events:[],news:[],awards:[],
   rivals:RIVALS.map(n=>({n,nw:rnd(5e6,30e6),g:rnd(.0012,.0028),rep:rnd(50,85),yp:0,ypax:0})),

  localStorage.setItem(SAVE,j);if(++saveN%20==1)localStorage.setItem(SAVE+'_backup',j)}catch(e){}}

function migrate(){const d=newGame();for(const k in d)if(S[k]===undefined)S[k]=d[k];S.v=SAVE_VERSION}

function mkpts(r){return gc(C[r.a],C[r.b],Math.max(16,Math.min(300,Math.round(r.dist/50))))}
const routeOf=p=>S.routes.find(r=>r.id==p.route);
const insure=()=>S.up.ins*.25;
const fuelPrice=()=>1.2*S.fuel*(1-.08*S.up.hedge);
const fleetValue=()=>S.planes.reduce((a,p)=>a+TY[p.type].price*.8,0);
const debt=()=>(S.loans||[]).reduce((a,l)=>a+l.bal,0);
const netWorth=()=>S.cash+fleetValue()-debt();
// bigger company (more cash + aircraft + route network) => bigger credit line
const companyValue=()=>Math.max(0,S.cash)+fleetValue()+S.routes.length*50000;
const creditLimit=()=>Math.max(250000,companyValue()*.6);
const creditLeft=()=>Math.max(0,creditLimit()-debt());
function loanRate(amt,term){return (cleanOK()?-.01:0)+.07+.03*term/365+.12*Math.min(1,(debt()+amt)/Math.max(1,companyValue()))}

/* ===================== economics ===================== */
function paxRef(r){return 90+.25*r.dist}
function cargoRef(r){return 120+.5*r.dist}
function repF(){return .6+.8*Math.min(100,S.rep+S.up.lounge*5)/100}
const strike=()=>(S.strikeUntil&&S.day<S.strikeUntil)||(S.cyberUntil&&S.day<S.cyberUntil);
const boost=()=>(S.boostUntil&&S.day<S.boostUntil?1.3:1)*(S.leakUntil&&S.day<S.leakUntil?.9:1);
const addRep=n=>{S.rep=Math.max(0,Math.min(100,S.rep+n))};
const saleOn=r=>r.sale&&S.day<r.sale.until;
const effMult=r=>r.mult*(saleOn(r)?1-r.sale.pct:1);
function rate(r,cargo){
  const m=effMult(r);
  if(cargo)return r.cb*Math.pow(1/m,1.5)*repF()*boost();
  return (r.base+(r.xfer||0))*Math.pow(1/m,1.8)*(.7+.5*S.svc/100)*repF()*boost()}
function fareFor(t,r){return (t.kind=='ship'?t.fare0+t.fkm*r.dist:t.kind=='pax'?paxRef(r):cargoRef(r))*effMult(r)}
function book(p,r,amt){p.profit+=amt;r.dayP+=amt;S.dayProfit+=amt;S.yearProfit+=amt}

function stepPlane(p,h){
  if(p.state=='repair'){p.rep-=h;if(p.rep<=0){p.state='turn';p.t=0}return}
  const r=routeOf(p);if(!r){p.state='idle';return}
  const T=TY[p.type];
  if(r.blocked){if(p.state!='grounded')cancelPlane(p,r,null);return}
  if(p.state=='grounded'||p.state=='idle'){p.state='turn';p.t=0}
  if(p.state=='turn'){
    p.t+=h;
    if(p.t>=0&&(p.cond??100)<15){const c=T.price*.01;S.cash-=c;book(p,r,-c);p.cond=100;p.state='repair';p.rep=36;p.want=null;
      news(`🔧 Mandatory maintenance: ${T.name} ${p.reg} fell below 15% condition and was grounded for service (${fmt(c)}).`,'warn');return}
    if(S.autoSvc&&p.t>=0&&(p.cond??100)<S.autoThr){const c=T.price*.01;if(S.cash>=c){S.cash-=c;book(p,r,-c);p.cond=100;p.state='repair';p.rep=36;p.want=null;return}}
    if(p.t>=T.turn&&!strike()){
      const pool=T.kind=='cargo'?r.cpool:r.pool,want=p.want||(p.want=Math.max(1,Math.round(T.cap*rnd(.45,.9)))),load=Math.min(want,Math.floor(pool[p.dir]));
      if(load>=want*.7||(p.t>T.turn+6&&load>=1))depart(p,r,T,pool,load)}
  }else if(p.state=='fly'){p.t+=h;if(p.t>=p.dur)arrive(p,r,T)}
}
function depart(p,r,T,pool,load){
  pool[p.dir]-=load;
  const wf=wxFactor(r),rev=load*fareFor(T,r),dur=(r.dist/T.speed+.35)*wf;
  const fuel=r.dist*T.burn*fuelPrice()*wf,crew=dur*(T.hr*2.2+T.price*.0002)*S.wage,svc=T.kind!='cargo'?load*(2+.25*S.svc):0,cost=fuel+crew+svc;
  const oid=p.dir?r.b:r.a;addUse(oid,load*(T.kind=='cargo'?5:1));
  const pen=rev*Math.min(.35,Math.max(0,apOver(oid)-1)*.35);if(pen>0)S.rep=Math.max(0,S.rep-.02);
  S.cash+=rev-cost-pen;book(p,r,rev-cost-pen);S.life+=rev;
  p.fl={load,rev,fuel,crew,svc,pen};p.want=null;p.state='fly';p.t=0;p.dur=dur;p.cond=Math.max(0,(p.cond??100)-dur*(T.kind=='ship'?.06:.35));
  if(p.cond<25&&Math.random()<.06)breakdown(p,r)}
function breakdown(p,r){
  const T=TY[p.type],cost=T.price*.04*(1-insure());S.cash-=cost;book(p,r,-cost);
  S.cash-=p.fl.rev;book(p,r,-p.fl.rev);S.life-=p.fl.rev;S.rep=Math.max(0,S.rep-2);
  news(`🔧 ${T.name} ${p.reg} broke down (poor maintenance). Passengers refunded, repair ${fmt(cost)}, out for 3 days.`,'warn');
  p.fl=null;p.state='repair';p.rep=72;p.cond=60}
function arrive(p,r,T){
  const dest=C[p.dir?r.a:r.b],fee=landingFee(dest,T);addUse(p.dir?r.a:r.b,p.fl.load*(T.kind=='cargo'?5:1));
  S.cash-=fee;book(p,r,-fee);
  const f=p.fl,t=r.tot||(r.tot={rev:0,fuel:0,crew:0,svc:0,fee:0,n:0});
  t.rev+=f.rev;t.fuel+=f.fuel;t.crew+=f.crew;t.svc+=f.svc;t.fee+=fee+(f.pen||0);t.n++;p.rev=(p.rev||0)+f.rev;
  const pr=f.rev-f.fuel-f.crew-f.svc-fee-(f.pen||0);r.last={rev:f.rev,profit:pr,margin:f.rev?pr/f.rev:0,load:f.load/T.cap};
  S.st.flights++;if(T.kind!='cargo'){S.st.pax+=p.fl.load;S.yearPax+=p.fl.load}else S.st.tons+=p.fl.load;
  r.flown=(r.flown||0)+1;r.lf=(r.lf||0)*.9+.1*p.fl.load/T.cap;
  p.fl=null;p.want=null;p.dir^=1;p.state='turn';p.t=0}
function cancelPlane(p,r,tot){
  const T=TY[p.type];let refund=0;
  if(p.state=='fly')refund=p.fl.rev;
  else{const pool=T.kind=='cargo'?r.cpool:r.pool,n=Math.min(T.cap,Math.floor(pool[p.dir]));refund=n*fareFor(T,r);pool[p.dir]-=n}
  const k=1-insure();refund*=k;
  const fee=8*(landingFee(C[r.a],T)+landingFee(C[r.b],T))*k;
  S.cash-=refund+fee;book(p,r,-(refund+fee));
  S.st.cancels++;S.st.refunds+=refund;S.st.fees+=fee;S.rep=Math.max(0,S.rep-1.5);
  if(tot){tot.n++;tot.refund+=refund;tot.fee+=fee}
  p.state='grounded';p.fl=null;p.t=0;p.want=null}

/* ===================== airports (capacity) ===================== */
const apCap=id=>(1000+2500*Math.sqrt(C[id].pop/1e6))*(S.ap[id]?S.ap[id].lvl:1);
const apUp=id=>150000*(S.ap[id]?S.ap[id].lvl:1)*(1+Math.sqrt(C[id].pop/1e6));
function boardOK(what){return typeof boardGate=='function'?boardGate(what):true}
function addUse(id,n){const a=S.ap[id]||(S.ap[id]={lvl:1,used:0,last:0});a.used+=n}
function apOver(id){const a=S.ap[id];if(!a)return 0;return (a.used+(a.last||0)*(1-(S.day-Math.floor(S.day))))/apCap(id)}
function upgradeAirport(id){const c=apUp(id),a=S.ap[id]||(S.ap[id]={lvl:1,used:0,last:0});
  if(a.lvl>=5){toast('Airport is at max level.','warn');return}if(S.cash<c){toast('Not enough cash.','warn');return}
  S.cash-=c;a.lvl++;toast(`${C[id].name} airport expanded to level ${a.lvl}.`,'good');renderBody()}

/* ===================== transfers (connecting passengers) ===================== */
function recalcTransfers(){
  const at={},served=new Set(S.planes.filter(p=>p.route).map(p=>p.route)),direct=new Set();
  S.routes.forEach(r=>{(at[r.a]=at[r.a]||[]).push(r);(at[r.b]=at[r.b]||[]).push(r);direct.add(Math.min(r.a,r.b)+'_'+Math.max(r.a,r.b))});
  for(const r of S.routes){let x=0;
    if(served.has(r.id))for(const H of[r.a,r.b]){const A=H==r.a?r.b:r.a;
      for(const q of at[H]){if(q===r||!served.has(q.id))continue;const B=q.a==H?q.b:q.a;if(B==A)continue;
        if(direct.has(Math.min(A,B)+'_'+Math.max(A,B)))continue;
        const dAB=hav(C[A].lat,C[A].lon,C[B].lat,C[B].lon),detour=(r.dist+q.dist)/Math.max(100,dAB);if(detour>1.8)continue;
        x+=.25*pairDemand(A,B,dAB,8)/detour}}
    r.xfer=x}}

/* ===================== weather ===================== */
const WX={rain:{c:'rgba(70,140,255,.30)',ic:'🌧️',f:1.08,n:'Rain'},storm:{c:'rgba(160,80,255,.38)',ic:'⛈️',f:1.35,n:'Thunderstorms'},snow:{c:'rgba(235,245,255,.40)',ic:'❄️',f:1.15,n:'Snow'},
 fog:{c:'rgba(210,210,210,.32)',ic:'🌫️',f:1.1,n:'Fog',apt:1},wind:{c:'rgba(255,255,255,.14)',ic:'💨',f:1.12,n:'Strong headwinds'}};
function spawnWx(){
  const lat=rnd(-48,62),a=Math.abs(lat);let type;const x=Math.random();
  if(a>46)type=x<.45?'snow':x<.75?'wind':'rain';else if(a<25)type=x<.5?'storm':x<.85?'rain':'wind';else type=x<.35?'rain':x<.55?'fog':x<.8?'wind':'storm';
  S.wx.push({type,lat,lon:rnd(-180,180),r:rnd(250,650),vx:(a<25?-1:1)*rnd(.5,3),vy:rnd(-.4,.4),life:rnd(4,10)})}
function initWx(){S.wx=[];for(let i=0;i<14;i++)spawnWx()}
function moveWx(h){const d=h/24;for(const w of S.wx){w.lon+=w.vx*d;w.lat+=w.vy*d;w.life-=d;if(w.lon>180)w.lon-=360;if(w.lon<-180)w.lon+=360}}
function wxTick(){S.wx=S.wx.filter(w=>w.life>0&&Math.abs(w.lat)<75);while(S.wx.length<14)spawnWx()}
function wxAt(lat,lon){return S.wx.filter(w=>hav(lat,lon,w.lat,w.lon)<=w.r)}
function wxText(lat,lon){const w=wxAt(lat,lon);return w.length?'Weather: '+w.map(x=>WX[x.type].ic+' '+WX[x.type].n).join(', '):'Weather: ☀️ Clear'}
function wxFactor(r){let f=1;
  for(const w of S.wx){const t=WX[w.type];
    if(t.apt){if(hav(C[r.a].lat,C[r.a].lon,w.lat,w.lon)<=w.r||hav(C[r.b].lat,C[r.b].lon,w.lat,w.lon)<=w.r)f=Math.max(f,t.f);continue}
    for(let i=0;i<r.pts.length;i+=3){const q=r.pts[i];if(hav(q[1],q[0],w.lat,w.lon)<=w.r){f=Math.max(f,t.f);break}}}
  r.wf=f;return f}

/* ===================== crises ===================== */
const AIRSPACE={war:1,volcano:1};
function routeHit(ev,r){
  const A=C[r.a],B=C[r.b];
  if(hav(ev.lat,ev.lon,A.lat,A.lon)<=ev.r||hav(ev.lat,ev.lon,B.lat,B.lon)<=ev.r)return 'airport';
  if(AIRSPACE[ev.type]&&r.mode!='sea')for(const q of r.pts)if(hav(ev.lat,ev.lon,q[1],q[0])<=ev.r)return 'airspace';
  return null}
function refreshBlocks(){
  const act=S.events.filter(e=>e.phase=='active'),tots={};
  for(const r of S.routes){
    let hit=null;for(const ev of act){const k=routeHit(ev,r);if(k){hit={ev:ev.id,kind:k};break}}
    const was=r.blocked;r.blocked=hit;
    if(hit&&!was){const tot=tots[hit.ev]||(tots[hit.ev]={n:0,refund:0,fee:0,routes:0});tot.routes++;
      S.planes.filter(p=>p.route==r.id&&p.state!='repair').forEach(p=>{cancelPlane(p,r,tot);
        const ev=S.events.find(e=>e.id==hit.ev);
        if(ev&&ev.type=='protest'&&Math.random()<.4){const T=TY[p.type],c=T.price*rnd(.05,.12)*(1-insure());
          S.cash-=c;book(p,r,-c);p.state='repair';p.rep=rnd(4,10)*24;tot.dmg=(tot.dmg||0)+1;tot.dmgc=(tot.dmgc||0)+c}})}
    if(!hit&&was)toast(`Airspace reopened: ${C[r.a].name} ↔ ${C[r.b].name}. Flights resume.`,'good')}
  for(const id in tots){const ev=S.events.find(e=>e.id==id),t=tots[id];
    if(t.routes)news(`🚫 ${AIRSPACE[ev.type]?'Airspace closed':'Airport closed'} (${ev.label}): ${t.routes} route(s) blocked, ${t.n} flight(s) cancelled. Refunded tickets ${fmt(t.refund)} + airport fees ${fmt(t.fee)}.${t.dmg?` Protesters damaged ${t.dmg} aircraft (repairs ${fmt(t.dmgc)}, out of service for days).`:''}`,'war')}
}
const anyCity=()=>C[Math.floor(Math.random()*C.length)],bigCity=()=>{let c;do{c=C[Math.floor(Math.random()*400)]}while(c.pop<1e6);return c};
const CR={
 war:{w:.35,r:[350,800],d:[20,70],warn:3,pick:()=>C[Math.floor(Math.pow(Math.random(),.8)*C.length)],txt:c=>`armed conflict near ${c.name}, ${c.country}`,name:'Airspace warning'},
 protest:{w:.25,r:[45,45],d:[5,14],warn:2,pick:bigCity,txt:c=>`protests in ${c.name}, ${c.country}`,name:'Unrest warning'},
 volcano:{w:.2,r:[300,600],d:[6,20],warn:1,pick:anyCity,txt:c=>`volcanic ash cloud near ${c.name}, ${c.country}`,name:'Ash cloud warning'},
 storm:{w:.2,r:[150,250],d:[2,6],warn:1,pick:anyCity,txt:c=>`severe storm over ${c.name}, ${c.country}`,name:'Storm warning'}};
function spawnEvent(){
  const act=S.events.filter(e=>e.phase!='ended');if(act.length>=3)return false;
  let x=Math.random(),type='storm';for(const k in CR){if(x<CR[k].w){type=k;break}x-=CR[k].w}
  const cf=CR[type],c=cf.pick(),sudden=Math.random()<.5,warnDays=sudden?0:cf.warn,dur=rnd(cf.d[0],cf.d[1]);

  const key=S.routes.length+'|'+S.planes.length+'|'+rng+'|'+seats;if(SUG.key==key)return SUG.val;
  const net=new Set(S.routes.flatMap(r=>[r.a,r.b])),have=new Set(S.routes.map(r=>Math.min(r.a,r.b)+'_'+Math.max(r.a,r.b)));

  for(const a of srcs)for(let b=0;b<top;b++){

  zFit=Math.max(W/360,H/150);if(V.z<zFit*.95)V.z=zFit}
window.addEventListener('resize',resize);
const sx=(lon)=>W/2+(lon-V.cx)*V.z, sy=(lat)=>H/2-(lat-V.cy)*V.z;
const OFF=[-360,0,360];
function clampView(){V.z=Math.max(zFit*.95,Math.min(80,V.z));V.cy=Math.max(-70,Math.min(85,V.cy));while(V.cx>180)V.cx-=360;while(V.cx<-180)V.cx+=360}
function visCount(){return Math.min(C.length,Math.floor(180*Math.pow(V.z/zFit,2.3)))}
function cityR(c){return 1.6+Math.sqrt(c.pop/1e6)*1.6*Math.min(2.2,Math.max(.7,V.z/zFit/2.5+.5))}
function draw(){
  cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0a2236';cx.fillRect(0,0,W,H);
  cx.fillStyle='#24566a';cx.strokeStyle='#4a8da0';cx.lineWidth=.7;
  for(const o of OFF){for(const poly of D.land){cx.beginPath();
    for(const ring of poly){ring.forEach((p,i)=>{const x=sx(p[0]+o),y=sy(p[1]);i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.closePath()}
    cx.fill('evenodd');cx.stroke()}}
  // weather
  for(const w of S.wx){const t=WX[w.type],ry=w.r/111*V.z,rx=ry/Math.max(.25,Math.cos(w.lat*D2R));
    for(const o of OFF){const x=sx(w.lon+o),y=sy(w.lat);if(x<-rx||x>W+rx||y<-ry||y>H+ry)continue;
      cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,7);cx.fillStyle=t.c;cx.fill();
      if(ry>14){cx.font=Math.min(30,ry*.5)+'px serif';cx.textAlign='center';cx.fillText(t.ic,x,y);cx.textAlign='left';cx.font='11px -apple-system,sans-serif'}}}
  // crises
  const pulse=.5+.5*Math.sin(performance.now()/350);
  for(const ev of S.events){if(ev.phase=='ended')continue;
    const act=ev.phase=='active',ry=ev.r/111*V.z,rx=ry/Math.max(.2,Math.cos(ev.lat*D2R));
    for(const o of OFF){const x=sx(ev.lon+o),y=sy(ev.lat);if(x<-rx||x>W+rx)continue;
      cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,7);
      cx.fillStyle=act?`rgba(255,70,70,${.18+.12*pulse})`:`rgba(255,200,70,${.1+.1*pulse})`;cx.fill();
      cx.strokeStyle=act?'#ff5d5d':'#ffc548';cx.lineWidth=1.5;cx.setLineDash(act?[]:[6,5]);cx.stroke();cx.setLineDash([])}}
  // routes
  for(const r of S.routes){
    cx.lineWidth=1.3;cx.strokeStyle=r.blocked?'#ff5d5d':r.mode=='sea'?(r.lastP<0?'#ffc548':'#6ee7ff'):(r.lastP<0?'#ffc548':'#2fd0b5');cx.setLineDash(r.blocked?[5,4]:r.mode=='sea'?[2,4]:[]);
    for(const o of OFF){cx.beginPath();r.pts.forEach((p,i)=>{const x=sx(p[0]+o),y=sy(p[1]);i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke()}}
  cx.setLineDash([]);
  if(S.showRivals)for(const v of S.rivals){cx.strokeStyle=v.color||'#fff';cx.globalAlpha=.4;cx.lineWidth=1;cx.setLineDash([3,6]);
    for(const rr of v.routes){const pts=rr.pts||(rr.pts=gc(C[rr.a],C[rr.b],Math.max(12,Math.round((rr.dist||1000)/80))));
      for(const o of OFF){cx.beginPath();pts.forEach((p,i)=>{const x=sx(p[0]+o),y=sy(p[1]);i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke()}}}
  cx.globalAlpha=1;cx.setLineDash([]);
  // cities
  const n=visCount(),hubs=new Set();S.routes.forEach(r=>{hubs.add(r.a);hubs.add(r.b)});
  cx.font='11px -apple-system,sans-serif';cx.textBaseline='middle';
  for(let i=0;i<n;i++){const c=C[i],rr=cityR(c),isH=hubs.has(i);
    for(const o of OFF){const x=sx(c.lon+o),y=sy(c.lat);if(x<-20||x>W+20||y<-20||y>H+20)continue;
      cx.beginPath();cx.arc(x,y,rr,0,7);cx.fillStyle=isH?'#2fd0b5':'#e8d9a8';cx.globalAlpha=isH?1:.85;cx.fill();cx.globalAlpha=1;
      if(S.sel==i||S.from==i){cx.beginPath();cx.arc(x,y,rr+4,0,7);cx.strokeStyle=S.from==i?'#4aa3ff':'#fff';cx.lineWidth=2;cx.stroke()}
      if(i<n/5&&V.z>zFit*1.8||isH&&V.z>zFit*1.3){cx.fillStyle='#cfe0f0';cx.fillText(c.name,x+rr+3,y)}}}
  for(const id of [S.sel,S.from])if(id!=null&&id>=n){const c=C[id];for(const o of OFF){cx.beginPath();cx.arc(sx(c.lon+o),sy(c.lat),5,0,7);cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke()}}
  // planes
  for(const p of S.planes){const r=routeOf(p);if(!r)continue;
    let f=p.state=='fly'?p.t/p.dur:(p.dir?1:0);if(p.state=='fly'&&p.dir)f=1-f;
    const T=TY[p.type];
    for(const o of OFF){
      const pt=at(r.pts,f),p2=at(r.pts,Math.min(1,f+.01)),p0=at(r.pts,Math.max(0,f-.01));
      const x=sx(pt[0]+o),y=sy(pt[1]);if(x<-10||x>W+10||y<-10||y>H+10)continue;
      let ang=Math.atan2(sy(p2[1])-sy(p0[1]),sx(p2[0])-sx(p0[0]));if(p.dir&&p.state=='fly')ang+=Math.PI;
      if(p.state=='fly'&&!(p.dir))ang=ang;
      cx.save();cx.translate(x,y);cx.rotate(ang);
      const kk=(.85+Math.min(.9,(T.kind=='cargo'?T.cap*4:T.kind=='ship'?T.cap/6:T.cap)/650))*Math.min(1.5,.7+V.z/zFit*.1);
      if(T.kind=='ship')drawShip(cx,T,planeColor(T),kk*.9);else drawPlane(cx,p.type,planeColor(T),kk);
      if(p.state=='repair'||p.state=='grounded'){cx.beginPath();cx.arc(0,0,(T.kind=='ship'?14:SHAPE[p.type][0])*.8*kk,0,7);cx.strokeStyle=p.state=='repair'?'#ffc548':'#ff5d5d';cx.lineWidth=2;cx.stroke()}
      cx.restore()}}
  requestAnimationFrame(frame)}
function at(pts,f){const x=f*(pts.length-1),i=Math.min(pts.length-2,Math.floor(x)),t=x-i;return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t,pts[i][1]+(pts[i+1][1]-pts[i][1])*t]}
function nearest(mx,my,maxd){const n=visCount();let best=null,bd=maxd||12;
  for(let i=0;i<n;i++){const c=C[i];for(const o of OFF){const d=Math.hypot(sx(c.lon+o)-mx,sy(c.lat)-my)-cityR(c);if(d<bd){bd=d;best=i}}}return best}
// interaction
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:V.cx,cy:V.cy,m:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.m=true;cv.classList.add('drag')}
    if(drag.m){V.cx=drag.cx-dx/V.z;V.cy=drag.cy+dy/V.z;clampView()}}
  const i=drag&&drag.m?null:nearest(mx,my,8),tp=$('#tip');
  if(i!=null){tp.style.display='block';tp.style.left=(e.clientX+12)+'px';tp.style.top=(e.clientY+12)+'px';tp.textContent=C[i].name+', '+C[i].country+' ('+C[i].iata+') · '+fpop(C[i].pop)}else tp.style.display='none'});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');
  if(drag&&!drag.m){const r=cv.getBoundingClientRect(),i=nearest(e.clientX-r.left,e.clientY-r.top,12);selectCity(i)}drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const lon=V.cx+(mx-W/2)/V.z,lat=V.cy-(my-H/2)/V.z;V.z*=Math.exp(-e.deltaY*.0015);clampView();
  V.cx=lon-(mx-W/2)/V.z;V.cy=lat+(my-H/2)/V.z;clampView()},{passive:false});
$('#zi').onclick=()=>{V.z*=1.5;clampView()};$('#zo').onclick=()=>{V.z/=1.5;clampView()};
$('#zr').onclick=()=>{V.cx=10;V.cy=25;V.z=zFit};
function focus(c,z){V.cx=c.lon;V.cy=c.lat;V.z=Math.max(V.z,zFit*(z||4));clampView()}

/* search */
const sin=$('#sin'),sres=$('#sres');
sin.addEventListener('input',()=>{const q=sin.value.trim().toLowerCase();if(!q){sres.style.display='none';return}
  const out=[];for(let i=0;i<C.length&&out.length<9;i++)if(SEARCH[i].startsWith(q)||(out.length<9&&SEARCH[i].includes(q)))out.push(i);
  sres.innerHTML=out.map(i=>`<div data-i="${i}">${esc(C[i].name)}, ${esc(C[i].country)} <span class="mut">${C[i].iata} · ${fpop(C[i].pop)}</span></div>`).join('')||'<div class="mut">No match</div>';sres.style.display='block'});
sres.addEventListener('click',e=>{const i=e.target.closest('[data-i]');if(!i)return;const c=+i.dataset.i;sres.style.display='none';sin.value='';selectCity(c,true)});

/* ===================== city card / routes ===================== */
function selectCity(i,fly){S.sel=i;const el=$('#city');
  if(i==null){el.style.display='none';return}
  const c=C[i];if(fly)focus(c,6);
  const lim=maxCap(c,'pax');
  let h=`<div class="row"><h4>${esc(c.name)}, ${esc(c.country)}</h4><button onclick="selectCity(null)">✕</button></div>
   <div class="mut">✈ Airport ${c.iata}${c.port?' · ⚓ Port':''} · Metro pop. ${fpop(c.pop)} · Max aircraft: ${lim>=9999?'any':lim+' seats'}</div><div class="mut">${appealText(c)}</div><div class="mut">${wxText(c.lat,c.lon)}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">`;
  if(S.from==null)h+=`<button class="pri" onclick="S.from=${i};selectCity(${i})">Start a route here</button>`;
  else if(S.from==i)h+=`<button onclick="S.from=null;selectCity(${i})">Cancel route</button>`;
  else h+=`<button class="pri" onclick="routeDialog(${S.from},${i})">Route ${esc(C[S.from].name)} ↔ here</button><button onclick="S.from=${i};selectCity(${i})">Use as origin</button>`;
  el.innerHTML=h+'</div>';el.style.display='block'}

function openFee(a,b,dist){return 40000+150*dist+20000*(Math.sqrt(C[a].pop/1e6)+Math.sqrt(C[b].pop/1e6))}
function seaDemand(a,b,d){return Math.max(10,pairDemand(a,b,d,0)*.35)}
const BB=D.land.map(poly=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of poly[0]){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}return [x0,x1,y0,y1]});
function onLand(lon,lat){while(lon>180)lon-=360;while(lon<-180)lon+=360;
  for(let i=0;i<D.land.length;i++){const b=BB[i];if(lon<b[0]||lon>b[1]||lat<b[2]||lat>b[3])continue;let inside=false;
    for(const ring of D.land[i]){let c=false;for(let j=0,k=ring.length-1;j<ring.length;k=j++){const xi=ring[j][0],yi=ring[j][1],xk=ring[k][0],yk=ring[k][1];if((yi>lat)!=(yk>lat)&&lon<(xk-xi)*(lat-yi)/(yk-yi)+xi)c=!c}if(c)inside=!inside}
    if(inside)return true}return false}
function seaPathOk(a,b){const pts=gc(C[a],C[b],30);let n=0,t=0;for(let i=4;i<=26;i++){t++;if(onLand(pts[i][0],pts[i][1]))n++}return n/t<.2}
function routeDialog(a,b){
  const A=C[a],B=C[b],gcd=hav(A.lat,A.lon,B.lat,B.lon),has=m=>S.routes.find(r=>((r.a==a&&r.b==b)||(r.a==b&&r.b==a))&&(r.mode||'air')==m);
  const feeAir=openFee(a,b,gcd),baseAir=pairDemand(a,b,gcd);
  const canSea=A.port&&B.port&&seaPathOk(a,b),dSea=gcd*1.2,feeSea=feeAir*.6,baseSea=seaDemand(a,b,dSea);
  const airFits=TYPES.filter(t=>t.kind!='ship'&&t.range>=gcd&&t.cap<=Math.min(maxCap(A,t.kind),maxCap(B,t.kind)));
  const seaFits=TYPES.filter(t=>t.kind=='ship'&&t.range>=dSea&&t.cap<=Math.min(maxShip(A),maxShip(B)));
  const sanc=S.sanctionUntil&&S.day<S.sanctionUntil;
  $('#mbox').innerHTML=`<div class="row"><h3 style="margin:0">${esc(A.name)} ↔ ${esc(B.name)}</h3><button onclick="closeModal()">✕</button></div>
   <p class="mut">${esc(A.name)}: ${appealText(A)}${A.port?' · ⚓ port':''}<br>${esc(B.name)}: ${appealText(B)}${B.port?' · ⚓ port':''}</p>
   ${sanc?'<p class="bad">🚫 Your airline is under sanctions: you cannot open new routes right now.</p>':''}
   <div class="card"><div class="row"><h4>✈️ Air route · ${Math.round(gcd)} km</h4><button class="pri" ${sanc||has('air')||S.cash<feeAir||!airFits.length?'disabled':''} onclick="openRoute(${a},${b},'air')">${has('air')?'Already open':'Open ('+fmt(feeAir)+')'}</button></div>
     <div class="mut">Demand ~${Math.round(baseAir)}/day each way · suggested fare ${fmt(90+.25*gcd)} · closing costs ${fmt(feeAir*.25)}<br>Aircraft: ${airFits.filter(t=>t.kind=='pax').map(t=>t.name).join(', ')||'<span class="bad">none fit (too far / airports too small)</span>'}</div></div>
   <div class="card"><div class="row"><h4>🚢 Sea route · ${Math.round(dSea)} km</h4><button class="pri" ${sanc||!canSea||has('sea')||S.cash<feeSea||!seaFits.length?'disabled':''} onclick="openRoute(${a},${b},'sea')">${has('sea')?'Already open':'Open ('+fmt(feeSea)+')'}</button></div>
     <div class="mut">${canSea?`Ferries and cruise ships · demand ~${Math.round(baseSea)}/day each way · slow but high fares. A route earns nothing until you assign a vessel.`:'Needs a port at both ends and open water between them.'}</div></div>
   <p class="mut">A route earns nothing until you assign a vehicle to it (Fleet tab).</p>`;
  $('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id=='modal')closeModal()});
function openRoute(a,b,mode){
  mode=mode||'air';const sea=mode=='sea';
  const A=C[a],B=C[b],gcd=hav(A.lat,A.lon,B.lat,B.lon),dist=sea?gcd*1.2:gcd,fee=openFee(a,b,gcd)*(sea?.6:1);
  if(S.sanctionUntil&&S.day<S.sanctionUntil){toast('You are under sanctions.','war');return}
  if(!boardOK('open a new route'))return;
  if(S.cash<fee){toast('Not enough cash.','warn');return}
  const r={id:S.nid++,a,b,dist,fee,mode,mult:1,base:sea?seaDemand(a,b,dist):pairDemand(a,b,dist),pool:[0,0],cpool:[0,0],dayP:0,lastP:0,lf:0,flown:0,blocked:null};
  r.cb=sea?0:Math.max(1,r.base*.12);r.pts=mkpts(r);
  S.cash-=fee;S.routes.push(r);refreshBlocksFor(r);recalcTransfers();
  S.from=null;closeModal();selectCity(null);
  toast(`${sea?'Sea':'Air'} route opened: ${A.name} ↔ ${B.name}. Now assign a ${sea?'vessel':'plane'} in Fleet.`,'good');tab='fleet';renderTabs();renderBody();showMenu(true)}
function refreshBlocksFor(r){for(const ev of S.events)if(ev.phase=='active'){const k=routeHit(ev,r);if(k){r.blocked={ev:ev.id,kind:k};return}}}
function buyPlane(id,quiet){
  const t=TY[id];if(S.life<t.unlock||S.cash<t.price){toast('Cannot buy that yet.','warn');return false}
  if(!quiet&&!boardOK('buy a '+t.name))return false;
  S.cash-=t.price;S.planes.push({cond:100,id:S.nid++,type:id,reg:t.kind=='ship'?pick(['Aurora','Poseidon','Horizon','Neptune','Mistral','Odyssey','Triton','Voyager','Meridian','Corsair','Serenity','Atlas'])+' '+Math.floor(rnd(1,99)):'N'+Math.floor(rnd(100,999))+String.fromCharCode(65+Math.floor(rnd(0,26)))+String.fromCharCode(65+Math.floor(rnd(0,26))),route:null,dir:0,state:'idle',t:0,profit:0});
  if(!quiet){toast(`Bought a ${t.name}.`,'good');renderBody();assignDialog(S.planes[S.planes.length-1].id)}return true}
/* ---- which route for a new plane? ---- */
function assignDialog(pid){
  const p=S.planes.find(x=>x.id==pid);if(!p)return;const T=TY[p.type];
  const opts=S.routes.filter(r=>canAssign(p,r)&&!r.blocked).map(r=>({r,n:S.planes.filter(q=>q.route==r.id).length})).sort((a,b)=>((b.r.base+(b.r.xfer||0))/(b.n+1))-((a.r.base+(a.r.xfer||0))/(a.n+1)));
  $('#mbox').innerHTML=`<div class="row"><h3 style="margin:0">${icon(T)} ${T.name} bought!</h3><button onclick="closeModal()">✕</button></div>
   <p class="mut">Which route should it fly? (Best matches first. It takes a day to position.)</p>
   ${opts.map((o,i)=>{const r=o.r;return `<div class="card"><div class="row"><h4>${routeName(r)}${i==0?' <span class="tag">best fit</span>':''}</h4><button class="pri" onclick="assign(${pid},${r.id});closeModal();toast('Assigned to ${esc(C[r.a].name)} ↔ ${esc(C[r.b].name)}.','good');renderBody()">Assign</button></div>
      <div class="mut">${Math.round(r.dist)} km · demand ~${Math.round(r.base+(r.xfer||0))}/day · ${o.n} plane(s) already · ${r.lastP!=null?fmt(r.lastP)+'/day':''}</div></div>`}).join('')||'<div class="card bad">None of your open routes suit this plane (too far or airports too small).</div>'}
   <div style="display:flex;gap:6px;margin-top:6px"><button onclick="closeModal();tab='ideas';showMenu(true);renderBody()">💡 See suggested routes</button><button onclick="closeModal()">Decide later</button></div>`;
  $('#modal').style.display='flex'}
function canAssign(p,r){const T=TY[p.type];if((T.kind=='ship')!=(r.mode=='sea'))return false;
  return T.range>=r.dist&&T.cap<=(T.kind=='ship'?Math.min(maxShip(C[r.a]),maxShip(C[r.b])):Math.min(maxCap(C[r.a],T.kind),maxCap(C[r.b],T.kind)))}
function assign(pid,rid){
  const p=S.planes.find(x=>x.id==pid);if(!p)return;
  if(!rid){p.route=null;p.state='idle';p.fl=null;return}
  const r=S.routes.find(x=>x.id==rid);
  if(!canAssign(p,r)){toast('That aircraft cannot serve this route.','warn');return}
  if(r.blocked){toast('That route is closed by a crisis.','war');return}
  p.route=rid;p.dir=0;p.state='turn';p.t=-24;p.fl=null;p.want=null;recalcTransfers()}
function loanQuote(){const amt=+$('#lAmt').value,term=+$('#lT').value,rt=loanRate(amt,term),pay=amt/term+amt*rt/365;
  $('#lA').textContent=fmt(amt);$('#lQ').textContent=(rt*100).toFixed(1)+'% APR';
  $('#lI').textContent=`Pays ${fmt(pay)}/day for ${term} days. Total interest about ${fmt(amt*rt*term/365/2)}.`}
function takeLoan(){const amt=Math.min(+$('#lAmt').value,creditLeft()),term=+$('#lT').value;if(amt<10000)return;
  if(S.sanctionUntil&&S.day<S.sanctionUntil){toast('Banks refuse to lend while you are under sanctions.','war');return}
  if(!boardOK('take out a loan'))return;
  S.loans.push({id:S.nid++,principal:amt,bal:amt,rate:loanRate(amt,term),term});S.cash+=amt;toast(`Loan approved: ${fmt(amt)}.`,'good');renderBody()}
function repayLoan(id){const l=S.loans.find(x=>x.id==id);if(!l||S.cash<l.bal)return;S.cash-=l.bal;S.loans=S.loans.filter(x=>x!=l);toast('Loan repaid in full.','good');renderBody()}
function servicePlane(id){const p=S.planes.find(x=>x.id==id),T=TY[p.type];S.cash-=T.price*.01;p.cond=100;p.state='repair';p.rep=36;p.fl=null;renderBody()}
function sellPlane(pid){const i=S.planes.findIndex(p=>p.id==pid);if(i<0)return;const p=S.planes[i];if(p.state=='fly'){toast('Wait until it lands.','warn');return}
  S.cash+=TY[p.type].price*.6;S.planes.splice(i,1);recalcTransfers();renderBody()}
const saleCost=r=>3000+r.dist*8;
function startSale(id){const r=S.routes.find(x=>x.id==id),c=saleCost(r);if(S.cash<c){toast('Not enough cash for the ad campaign.','warn');return}
  S.saleCount=(S.saleCount||0)+1;const pct=(+$('#sp'+id).value)/100;S.cash-=c;r.sale={pct,until:S.day+7};toast(`Sale started: ${Math.round(pct*100)}% off for 7 days. Cheaper tickets mean more passengers but thinner margins.`,'good');renderBody()}
const ARM={};
function armed(k,msg){if(ARM[k]&&Date.now()-ARM[k]<4000){delete ARM[k];return true}ARM[k]=Date.now();toast(msg,'warn');return false}
function resetGame(b){
  if(!armed('reset','Press "Reset game" again within 4 seconds to delete your airline.')){b.textContent='Click again to confirm';setTimeout(()=>{b.textContent='Reset game'},4000);return}
  try{localStorage.removeItem(SAVE);localStorage.removeItem(LEGACY);localStorage.removeItem(SAVE+'_backup')}catch(e){}
  S=newGame();S.routes=[];news('New airline started with $1M.');tab='routes';renderTabs();renderBody();save();location.reload()}
function closeRoute(rid){const r=S.routes.find(x=>x.id==rid),fee=(r.fee||openFee(r.a,r.b,r.dist))*.25;

      ${(S.offers||[]).map(o=>`<div class="row" style="margin-top:5px"><span>${esc(o.item)}<br><span class="mut">${Math.round(Math.min(.9,o.risk*(1+S.heat*.35))*bribeF()*100)}% risk of being caught</span></span><button class="dan" ${eligibleCargo()?'':'disabled'} onclick="shadyDeal(${o.id})">Run it · ${fmt(o.pay)}</button></div>`).join('')||'<div class="mut">No offers right now.</div>'}
      ${Object.keys(SCAMS).map(k=>`<div class="row" style="margin-top:5px"><span>🧾 ${SCAMS[k].n}<br><span class="mut">${scamRisk(k)}% risk · needs Crisis insurance${scamTarget()?'':' · no aircraft available'}</span></span><button class="dan" ${S.up.ins&&scamTarget()?'':'disabled'} onclick="scam('${k}')">Try it</button></div>`).join('')}
      <div style="margin-top:6px"><button class="dan" ${S.cash<Math.max(100000,netWorth()*.01)?'disabled':''} onclick="bribe()">💰 Bribe police &amp; officials · ${fmt(Math.max(100000,netWorth()*.01))}${S.bribeUntil&&S.day<S.bribeUntil?' (active '+Math.ceil(S.bribeUntil-S.day)+'d)':''}</button><div class="mut">Halves your chance of being caught for 30 days, but 15% of bribes get exposed.</div></div>
      <div class="mut" style="margin-top:4px">${eligibleCargo()?'Uses one of your cargo aircraft for 2 days.':'Needs a cargo aircraft. Or just stay clean and enjoy the perks.'} Getting caught: aircraft seized, big fine, sanctions, reputation crash.</div></div>
    <div class="card"><div class="row"><h4>🛡️ Security level ${sec}/3</h4>${sec<3?`<button ${S.cash<secC?'disabled':''} onclick="secUpgrade()">${fmt(secC)}</button>`:'<span class="good">MAX</span>'}</div>
      <div class="mut">Rivals can hire operatives to leak documents, run smear campaigns, launch cyber-attacks, or sabotage aircraft. Better security catches more plots and reduces damage.</div>
      ${sanc?`<div class="bad" style="margin-top:4px">🚫 Under sanctions for ~${Math.ceil(S.sanctionUntil-S.day)} more days: no new routes or loans.</div>`:''}
      <label class="mut" style="display:block;margin-top:5px"><input type="checkbox" ${S.showRivals?'checked':''} onchange="S.showRivals=this.checked"> Show rival routes on the map</label></div>`;
    h+=`<div class="card"><h4>Net worth ranking</h4><table>${[{n:S.name,nw:netWorth(),me:1},...S.rivals].sort((a,b)=>b.nw-a.nw).map((v,i)=>`<tr style="${v.me?'color:var(--acc);font-weight:700':''}"><td>${i+1}</td><td>${esc(v.n)}</td><td>${fmt(v.nw)}</td></tr>`).join('')}</table></div>`;
    h+=S.rivals.map((v,i)=>{const np=v.routes.reduce((a,r)=>a+r.planes.length,0),ev=S.evid[v.n]||0;
      return `<div class="card" style="border-left:4px solid ${v.color||'#888'}"><div class="row"><h4>${esc(v.n)}${v.nem?' <span class="tag red">your old company</span>':''}</h4><b>${fmt(v.nw)}</b></div>
      <div class="mut">${np} aircraft · ${v.routes.length} routes · rep ${Math.round(v.rep)}% · hostility <b class="${v.hostile>.6?'bad':v.hostile>.3?'warn':'good'}">${v.hostile>.6?'😡 high':v.hostile>.3?'😠 medium':'🙂 low'}</b></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px"><button onclick="focus(C[${v.hub}],2.2)">Show hub</button>
       <button class="pri" ${S.cash<acqPrice(v)?'disabled':''} onclick="acquire(${i})">Acquire ${fmt(acqPrice(v))}</button>
       ${ev?`<button onclick="pressCharges(${i})">⚖️ Press charges (${ev})</button>`:''}</div>
      <details style="margin-top:5px"><summary class="mut" style="cursor:pointer">🕶️ Covert operations (illegal, risky)</summary>
       <div class="mut" style="margin:4px 0">If your airline is caught, you face a big fine, sanctions and a reputation crash. This is a fictional game mechanic.</div>
       ${Object.keys(ATK).map(k=>`<div class="row" style="margin-top:3px"><span>${ATK[k].n}<br><span class="mut">${Math.round(ATK[k].ok*100)}% success · ${Math.round(ATK[k].caught*100)}% caught</span></span><button class="dan" ${S.cash<attackCost(v,k)?'disabled':''} onclick="dirty(${i},'${k}')">${fmt(attackCost(v,k))}</button></div>`).join('')}</details></div>`}).join('')}
  else if(tab=='news'){
    const act=S.events.filter(e=>e.phase!='ended'),wxr=S.routes.filter(r=>r.wf>1.05);
    h=(wxr.length?`<div class="card"><h4>🌦️ Weather delays</h4><div class="mut">${wxr.map(r=>routeName(r)+' (+'+Math.round((r.wf-1)*100)+'%)').join(' · ')}</div></div>`:'')+act.map(e=>`<div class="card" style="border-color:${e.phase=='active'?'var(--bad)':'var(--warn)'}"><h4>${e.phase=='active'?'🔴 ACTIVE':'🟡 WARNING'}: ${esc(e.label)}</h4>
      <div class="mut">${e.phase=='active'?'Ends':'Starts'} in ~${Math.max(0,Math.ceil((e.phase=='active'?e.end:e.start)-S.day))} days · radius ${Math.round(e.r)} km${AIRSPACE[e.type]?' · airspace closed':' · airport closed'}</div>
      <div style="margin-top:5px;display:flex;gap:6px"><button onclick="focus({lon:${e.lon},lat:${e.lat}},2.5)">Show on map</button><button class="pri" onclick="suspendAffected(${e.id})">Park affected planes</button></div></div>`).join('');
    h+=S.news.map(n=>`<div class="card ${n.type}" style="padding:6px 9px"><span class="mut">${dateStr(n.day)}</span> ${esc(n.t)}</div>`).join('')||'<div class="mut">Nothing yet.</div>'}
  b.innerHTML=h}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeModal();selectCity(null);S.from=null}});

/* ===================== loop ===================== */
let last=performance.now(),acc=0,paused=false;
function frame(){
  const now=performance.now();let dt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused){let h=dt*S.speed*.4;while(h>0){const s=Math.min(h,.25);stepSim(s);h-=s}}
  acc+=dt;if(acc>.6){acc=0;hud();const a=document.activeElement;
    if(!(a&&$('#body').contains(a)&&/SELECT|INPUT/.test(a.tagName))&&tab!='airline'&&tab!='finance'&&tab!='search')renderBody()}
  draw()}
function hud(){
  $('#sCash').textContent=fmt(S.cash);$('#sCash').style.color=S.cash<0?'var(--bad)':'';
  $('#sNW').textContent=fmt(netWorth());$('#sDate').textContent=dateStr(S.day);
  const pd=S.dayProfitShown||0;$('#sPD').textContent=fmt(S.est);$('#sPD').style.color=S.est<0?'var(--bad)':'var(--good)';
  $('#stShare').style.display=S.ipo?'':'none';if(S.ipo)$('#sShare').textContent='$'+sharePrice().toFixed(2);
  $('#sFuel').textContent='$'+fuelPrice().toFixed(2)+'/kg';$('#sRep').textContent=Math.round(S.rep)+'%';
  const act=S.events.filter(e=>e.phase!='ended').sort((a,b)=>(a.phase=='active'?0:1)-(b.phase=='active'?0:1))[0];
  $('#ticker').innerHTML=act?`<b>${act.phase=='active'?'🔴 CLOSED':'🟡 WARNING'}</b> ${esc(act.label)} — ${S.events.filter(e=>e.phase!='ended').length} active crisis alert(s)`:''}
$('#bP').onclick=function(){paused=!paused;this.textContent=paused?'▶':'⏸'};
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.sp;paused=false;$('#bP').textContent='⏸';document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x==b))});

/* ===================== boot ===================== */
if(!load()){S=newGame();initWx();news('Welcome! You have $1M. Buy a plane in the ☰ Menu → Shop, open a route between two cities (it costs money), then assign the plane in Fleet.')}
else{
  const away=Math.min((Date.now()-S.lastSeen)/1000,1200);
  if(away>30){const days=away/60,gain=Math.max(0,S.est)*days*.5;S.cash+=gain;S.day+=days;S.lastDay=Math.floor(S.day);
    toast(`Welcome back! Your airline earned ${fmt(gain)} while you were away.`,'good')}
  S.loans=S.loans||[];S.routes.forEach(r=>{r.base=r.mode=='sea'?seaDemand(r.a,r.b,r.dist):pairDemand(r.a,r.b,r.dist);r.cb=r.mode=='sea'?0:Math.max(1,r.base*.12)});if(!S.wx||!S.wx.length)initWx();S.ap=S.ap||{};S.camp=S.camp||{};S.autoThr=S.autoThr||40;S.scnDone=S.scnDone||[];S.paxPrev=S.paxPrev||30;S.paxMark=S.paxMark||S.st.pax;S.planes.forEach(p=>{if(p.state=='fly'){p.state='turn';p.t=0;p.fl=null}});refreshBlocks()}
document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',+x.dataset.sp==S.speed));
ensureRivals();recalcTransfers();resize();V.z=zFit;renderTabs();renderBody();hud();
try{if(!localStorage.getItem('fes_tut_done'))setTimeout(()=>showTut(0),400)}catch(e){setTimeout(()=>showTut(0),400)}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,30*60*1000);
window.addEventListener('beforeunload',save);
setInterval(save,15000);
requestAnimationFrame(frame);
</script>
</body>
</html>
